    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("propertyForm").addEventListener("submit", function(event) {
                event.preventDefault();
                let title = document.getElementById("title").value.trim();
                let description = document.getElementById("description").value.trim();
                let price = document.getElementById("price").value.trim();
                let image = document.getElementById("image").files[0];
                
                if (!title || !description || !price || !image) {
                    alert("Please fill out all fields and upload an image.");
                    return;
                }
                
                let reader = new FileReader();
                reader.onload = function(e) {
                    let propertyData = {
                        id: Date.now(),
                        title, 
                        description, 
                        price, 
                        imageSrc: e.target.result
                    };
                    let properties = JSON.parse(localStorage.getItem("properties")) || [];
                    properties.push(propertyData);
                    localStorage.setItem("properties", JSON.stringify(properties));
                    
                    alert("Property added successfully!");
                    document.getElementById("propertyForm").reset();
                };
                reader.readAsDataURL(image);
            });
        
            // Load properties on properties.html
            if (window.location.pathname.includes("properties.html")) {
                let properties = JSON.parse(localStorage.getItem("properties")) || [];
                let propertyList = document.getElementById("propertyList");
                
                function renderProperties() {
                    propertyList.innerHTML = "";
                    properties.forEach((prop, index) => {
                        let card = document.createElement("div");
                        card.classList.add("card");
                        card.innerHTML = `
                            <img src="${prop.imageSrc}" alt="Property Image" class="card-img">
                            <div class="card-title">${prop.title}</div>
                            <div class="card-desc">${prop.description}</div>
                            <div class="card-price">Price: ${prop.price}</div>
                            <button class="remove-btn" data-id="${prop.id}">Remove</button>
                        `;
                        propertyList.appendChild(card);
                    });
                }
                
                renderProperties();
                
                propertyList.addEventListener("click", function(event) {
                    if (event.target.classList.contains("remove-btn")) {
                        let propId = parseInt(event.target.getAttribute("data-id"));
                        properties = properties.filter(prop => prop.id !== propId);
                        localStorage.setItem("properties", JSON.stringify(properties));
                        renderProperties();
                    }
                });
            }
        });
        
    </script>
